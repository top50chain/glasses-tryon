<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>으뜸50안경 - 가상 안경 피팅</title>
<style>
  :root{
    --ink:#1c1c1c;
    --paper:#faf9f6;
    --line:#e4e1d8;
    --accent:#c8552d;
    --accent-dim:#e8d9cf;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  #odm50-tryon{
    font-family:-apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    background:var(--paper);
    color:var(--ink);
    max-width:480px;
    margin:0 auto;
    padding:14px 14px 24px;
  }
  #odm50-tryon h2{
    font-size:17px;
    font-weight:700;
    letter-spacing:-0.02em;
    margin:2px 4px 4px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  #odm50-tryon h2 .eyebrow{
    font-size:11px;
    font-weight:600;
    color:#fff;
    background:var(--accent);
    padding:2px 7px;
    border-radius:100px;
    letter-spacing:0;
  }
  .odm50-sub{
    font-size:12px;
    color:#8a8577;
    margin:0 4px 10px;
  }
  .odm50-stage{
    position:relative;
    width:100%;
    aspect-ratio:3/4;
    background:#111;
    border-radius:var(--radius);
    overflow:hidden;
    box-shadow:0 1px 3px rgba(0,0,0,.15);
  }
  .odm50-stage video{
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; opacity:0;
  }
  .odm50-stage canvas{
    position:absolute; inset:0; width:100%; height:100%;
  }
  .odm50-angle-badge{
    position:absolute;
    top:10px; left:10px;
    background:rgba(0,0,0,.5);
    color:#fff;
    font-size:11px;
    font-weight:600;
    padding:5px 10px;
    border-radius:100px;
    letter-spacing:.02em;
    pointer-events:none;
    transition:opacity .2s ease;
  }
  .odm50-overlay-msg{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
    color:#fff; text-align:center; padding:24px; font-size:13.5px; line-height:1.6;
    background:rgba(0,0,0,.35); backdrop-filter:blur(2px);
  }
  .odm50-overlay-msg button{
    margin-top:4px; background:var(--accent); color:#fff; border:none;
    padding:10px 20px; border-radius:100px; font-size:13.5px; font-weight:600; cursor:pointer;
  }
  .odm50-spinner{
    width:26px;height:26px; border-radius:50%;
    border:2.5px solid rgba(255,255,255,.35); border-top-color:#fff;
    animation:odm50-spin .8s linear infinite;
  }
  @keyframes odm50-spin{to{transform:rotate(360deg);}}

  .odm50-controls{
    display:flex; align-items:center; justify-content:space-between; margin-top:10px; gap:8px;
  }
  .odm50-iconbtn{
    width:42px;height:42px; border-radius:50%; border:1px solid var(--line); background:#fff;
    display:flex;align-items:center;justify-content:center; cursor:pointer; flex:none;
  }
  .odm50-iconbtn:active{background:var(--accent-dim);}
  .odm50-capture{
    flex:1; height:42px; border-radius:100px; border:none; background:var(--ink); color:#fff;
    font-size:14px; font-weight:700; letter-spacing:-0.01em; cursor:pointer;
  }
  .odm50-capture:active{opacity:.85;}

  .odm50-shelf{margin-top:14px;}
  .odm50-shelf-label{font-size:11.5px; color:#8a8577; margin:0 4px 8px; font-weight:600;}
  .odm50-shelf-track{display:flex; gap:10px; overflow-x:auto; padding:2px 4px 6px; scrollbar-width:none;}
  .odm50-shelf-track::-webkit-scrollbar{display:none;}
  .odm50-item{flex:none; width:66px; text-align:center; cursor:pointer;}
  .odm50-item .odm50-thumb{
    width:66px;height:66px; border-radius:14px; background:#fff; border:1.5px solid var(--line);
    display:flex;align-items:center;justify-content:center; overflow:hidden;
    transition:border-color .15s ease, transform .1s ease;
  }
  .odm50-item.odm50-active .odm50-thumb{border-color:var(--accent);}
  .odm50-item:active .odm50-thumb{transform:scale(.96);}
  .odm50-item .odm50-thumb img{width:82%;height:82%;object-fit:contain;}
  .odm50-item .odm50-name{font-size:10.5px; color:var(--ink); margin-top:5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

  .odm50-foot{margin-top:10px; font-size:11px; color:#9c9788; text-align:center; line-height:1.6;}

  /* ---- 버튼으로 열기 / 모달 ---- */
  .odm50-trigger{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    width:100%;
    max-width:480px;
    margin:0 auto;
    height:48px;
    border-radius:100px;
    border:1.5px solid var(--ink);
    background:#fff;
    color:var(--ink);
    font-size:14.5px;
    font-weight:700;
    letter-spacing:-0.01em;
    cursor:pointer;
    font-family:-apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  }
  .odm50-trigger:active{background:var(--accent-dim); border-color:var(--accent);}

  #odm50-modal-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    z-index:9999;
    align-items:flex-start;
    justify-content:center;
    overflow-y:auto;
    padding:24px 12px;
  }
  #odm50-modal-overlay.odm50-open{ display:flex; }
  .odm50-modal-box{
    position:relative;
    width:100%;
    max-width:480px;
    background:var(--paper);
    border-radius:20px;
    padding:0;
    box-shadow:0 10px 40px rgba(0,0,0,.35);
  }
  .odm50-modal-close{
    position:absolute;
    top:-14px; right:-14px;
    width:34px;height:34px;
    border-radius:50%;
    background:#1c1c1c;
    color:#fff;
    border:none;
    font-size:18px;
    line-height:1;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,.3);
    z-index:2;
  }
</style>
</head>
<body>

<button class="odm50-trigger" id="odm50-open-btn" type="button">
  📷 &nbsp;내 얼굴에 어울릴까? 가상피팅하기
</button>

<div id="odm50-modal-overlay">
  <div class="odm50-modal-box">
    <button class="odm50-modal-close" id="odm50-close-btn" type="button" aria-label="닫기">✕</button>

    <div id="odm50-tryon">
      <h2><span class="eyebrow">BETA</span> 으뜸50 가상피팅</h2>
      <p class="odm50-sub">고개를 천천히 좌우로 돌려보세요 — 얇은 메탈 프레임과 다리가 함께 움직여요</p>

      <div class="odm50-stage" id="odm50-stage">
    <video id="odm50-video" playsinline autoplay muted></video>
    <canvas id="odm50-canvas"></canvas>
    <div class="odm50-angle-badge" id="odm50-angle-badge" style="opacity:0;">정면</div>

    <div class="odm50-overlay-msg" id="odm50-msg">
      <div class="odm50-spinner"></div>
      <div id="odm50-msg-text">카메라를 준비하고 있어요…</div>
    </div>
  </div>

  <div class="odm50-controls">
    <button class="odm50-iconbtn" id="odm50-flip" title="카메라 전환" aria-label="카메라 전환">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M4 9a8 8 0 0 1 14-4.9M20 15a8 8 0 0 1-14 4.9" stroke="#1c1c1c" stroke-width="1.8" stroke-linecap="round"/><path d="M18 4v4h-4M6 20v-4h4" stroke="#1c1c1c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="odm50-capture" id="odm50-capture">사진으로 저장</button>
    <button class="odm50-iconbtn" id="odm50-reset" title="다시 시작" aria-label="다시 시작">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M3 12a9 9 0 1 1 3.2 6.9" stroke="#1c1c1c" stroke-width="1.8" stroke-linecap="round"/><path d="M3 6v6h6" stroke="#1c1c1c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <div class="odm50-shelf">
    <p class="odm50-shelf-label">착용해보기 · 컬러를 선택하세요</p>
    <div class="odm50-shelf-track" id="odm50-shelf-track"></div>
  </div>

      <p class="odm50-foot">iOS는 Safari, Android는 Chrome에서 가장 안정적으로 동작합니다.<br>카메라 화면은 저장되지 않으며 기기 안에서만 처리됩니다.</p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script>
(function(){
  "use strict";

  /* ============================================================
     상품 목록 -- 2607 모델, 정면 프레임과 한쪽 다리 2장
     image URL은 아임웹(또는 CDN)에 업로드한 실제 주소로 교체하세요.

     lensWidth/bridgeWidth/templeLength: 안경 스펙 표기 그대로
       예) "54ㅁ20-138" → lensWidth:54, bridgeWidth:20, templeLength:138
     이 실측 mm값으로 실제 동공간거리(홍채 위치)를 기준삼아 안경 크기를 계산합니다
     (더 이상 눈대중 fit 배율에 의존하지 않음).

     dy       : 상하 위치 보정 (양수=아래로), 눈사이거리에 대한 비율
     anchorX  : 이미지 안에서 "피벗(코다리/힌지)"의 가로 위치 비율(0=왼쪽 끝, 1=오른쪽 끝)
     ============================================================ */
  var PRODUCTS = [
    {
      id:"2607-C1",
      name:"2607 블랙 메탈",
      fitScale:0.94,
      assets:{
        frame:"assets/DIR10_2607_C1_frame.png",
        temple:"assets/DIR10_2607_C1_temple.png"
      },
      // 화면에서 결과를 보며 이 값만 미세 조정하면 됩니다.
      adjust:{
        dy:0.015,
        frameScaleY:1.00,
        templeLengthScale:0.72,
        templeThicknessScale:0.72,
        templeHingeX:0.485,
        templeHingeY:-0.03
      }
    }
  ];

  // 성인 평균 동공간거리(PD). 실제 얼굴의 홍채 사이 거리(px)를 이 mm값과 비교해서
  // "1mm가 화면에서 몇 px인지"를 계산 → 안경 실측 사이즈(mm)를 정확한 px로 환산.
  var AVG_PUPIL_DISTANCE_MM = 63; // 사용자별 실제 PD 입력 전 임시 평균값

  var videoEl   = document.getElementById('odm50-video');
  var canvasEl  = document.getElementById('odm50-canvas');
  var ctx       = canvasEl.getContext('2d');
  var stageEl   = document.getElementById('odm50-stage');
  var badgeEl   = document.getElementById('odm50-angle-badge');
  var msgEl     = document.getElementById('odm50-msg');
  var msgTextEl = document.getElementById('odm50-msg-text');
  var shelfEl   = document.getElementById('odm50-shelf-track');
  var flipBtn   = document.getElementById('odm50-flip');
  var captureBtn= document.getElementById('odm50-capture');
  var resetBtn  = document.getElementById('odm50-reset');
  var openBtn   = document.getElementById('odm50-open-btn');
  var closeBtn  = document.getElementById('odm50-close-btn');
  var modalOverlay = document.getElementById('odm50-modal-overlay');

  var currentFacing = "user";
  var currentProductIndex = 0;
  var loadedImages = {};
  var camera = null, faceMesh = null, stream = null;
  var lastBadgeText = "";
  var smoothedYaw = 0;
  var smoothedWidth = 0;
  var smoothedCenterX = 0;
  var smoothedCenterY = 0;
  var smoothedRoll = 0;
  var imageCropCache = {};

  function setMsg(text, showSpinner){
    msgEl.style.display = 'flex';
    msgTextEl.textContent = text;
    msgEl.querySelector('.odm50-spinner').style.display = showSpinner === false ? 'none' : 'block';
  }
  function hideMsg(){ msgEl.style.display = 'none'; }

  function loadImage(url){
    if (loadedImages[url]) return loadedImages[url];
    var img = new Image();
    img.crossOrigin = "anonymous";
    img.onerror = function(){ console.error("이미지 로드 실패:", url); };
    img.src = url;
    loadedImages[url] = img;
    return img;
  }


  // PNG 내부의 투명 여백을 제외하고 실제 안경 외곽만 사용합니다.
  function getVisibleCrop(img){
    var key = img.src;
    if (imageCropCache[key]) return imageCropCache[key];

    var fallback = {x:0,y:0,w:img.naturalWidth,h:img.naturalHeight};
    if (!img.complete || !img.naturalWidth) return fallback;

    try{
      var c=document.createElement('canvas');
      c.width=img.naturalWidth;
      c.height=img.naturalHeight;
      var cc=c.getContext('2d',{willReadFrequently:true});
      cc.drawImage(img,0,0);
      var d=cc.getImageData(0,0,c.width,c.height).data;
      var minX=c.width,minY=c.height,maxX=-1,maxY=-1;

      for(var y=0;y<c.height;y++){
        for(var x=0;x<c.width;x++){
          if(d[(y*c.width+x)*4+3]>10){
            if(x<minX)minX=x;
            if(x>maxX)maxX=x;
            if(y<minY)minY=y;
            if(y>maxY)maxY=y;
          }
        }
      }

      if(maxX<minX || maxY<minY){
        imageCropCache[key]=fallback;
      }else{
        minX=Math.max(0,minX-2);
        minY=Math.max(0,minY-2);
        maxX=Math.min(c.width-1,maxX+2);
        maxY=Math.min(c.height-1,maxY+2);
        imageCropCache[key]={
          x:minX,y:minY,w:maxX-minX+1,h:maxY-minY+1
        };
      }
    }catch(e){
      imageCropCache[key]=fallback;
    }
    return imageCropCache[key];
  }

  function preloadAllImages(){
    PRODUCTS.forEach(function(p){
      loadImage(p.assets.frame);
      loadImage(p.assets.temple);
    });
  }

  /* -------------------- 진열대 -------------------- */
  function renderShelf(){
    shelfEl.innerHTML = '';
    PRODUCTS.forEach(function(p, idx){
      var item = document.createElement('div');
      item.className = 'odm50-item' + (idx === currentProductIndex ? ' odm50-active' : '');
      item.innerHTML =
        '<div class="odm50-thumb"><img src="'+p.assets.frame+'" alt="'+p.name+'"></div>' +
        '<div class="odm50-name">'+p.name+'</div>';
      item.addEventListener('click', function(){
        currentProductIndex = idx;
        renderShelf();
      });
      shelfEl.appendChild(item);
    });
  }

  /* -------------------- 카메라 -------------------- */
  function startCamera(facing){
    stopCamera();
    setMsg('카메라를 준비하고 있어요…', true);
    var constraints = { video:{ facingMode:facing, width:{ideal:720}, height:{ideal:960} }, audio:false };

    navigator.mediaDevices.getUserMedia(constraints).then(function(s){
      stream = s;
      videoEl.srcObject = s;
      return videoEl.play();
    }).then(function(){
      hideMsg();
      runFaceMesh();
    }).catch(function(err){
      console.error(err);
      if (location.protocol !== 'https:') {
        setMsg('카메라를 사용하려면 https 주소에서 접속해야 해요.', false);
      } else {
        setMsg('카메라 권한이 필요해요. 브라우저 설정에서 카메라 접근을 허용해주세요.', false);
        var btn = document.createElement('button');
        btn.textContent = '다시 시도';
        btn.onclick = function(){ startCamera(currentFacing); };
        msgEl.appendChild(btn);
      }
    });
  }

  function stopCamera(){
    if (stream){ stream.getTracks().forEach(function(t){ t.stop(); }); stream = null; }
    if (camera){ try{ camera.stop(); }catch(e){} camera = null; }
  }

  function runFaceMesh(){
    if (!faceMesh){
      faceMesh = new FaceMesh({ locateFile:function(file){ return 'https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/' + file; } });
      faceMesh.setOptions({ maxNumFaces:1, refineLandmarks:false, minDetectionConfidence:0.6, minTrackingConfidence:0.6 });
      faceMesh.onResults(onResults);
    }
    camera = new Camera(videoEl, {
      onFrame: async function(){ await faceMesh.send({ image: videoEl }); },
      width:720, height:960
    });
    camera.start();
  }

  function resizeCanvasToVideo(){
    var rect = stageEl.getBoundingClientRect();
    canvasEl.width = rect.width * (window.devicePixelRatio || 1);
    canvasEl.height = rect.height * (window.devicePixelRatio || 1);
  }
  resizeCanvasToVideo();
  window.addEventListener('resize', resizeCanvasToVideo);

  function onResults(results){
    var w = canvasEl.width, h = canvasEl.height;
    ctx.save();
    ctx.clearRect(0,0,w,h);

    if (currentFacing === 'user'){
      ctx.translate(w, 0);
      ctx.scale(-1, 1);
    }

    // 영상과 랜드마크에 동일한 cover 확대율과 잘림 위치를 적용합니다.
    var cover = drawVideoCover(results.image, w, h);

    if (cover && results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0){
      drawGlasses(results.multiFaceLandmarks[0], w, h, cover);
    } else {
      setBadge('', false);
    }
    ctx.restore();
  }

  function drawVideoCover(img, w, h){
    var iw = img.videoWidth || img.width, ih = img.videoHeight || img.height;
    if (!iw || !ih) return null;

    var scale = Math.max(w/iw, h/ih);
    var dw = iw*scale, dh = ih*scale;
    var dx = (w-dw)/2, dy = (h-dh)/2;

    ctx.drawImage(img, dx, dy, dw, dh);
    return { iw:iw, ih:ih, scale:scale, dx:dx, dy:dy };
  }

  function setBadge(text, show){
    if (text !== lastBadgeText){
      badgeEl.textContent = text;
      lastBadgeText = text;
    }
    badgeEl.style.opacity = show ? '1' : '0';
  }

  // MediaPipe FaceMesh 인덱스
  // 33/263: 눈 바깥쪽, 168: 미간, 234/454: 좌우 관자놀이(볼) 라인, 1: 코끝
  function toPixel(p, cover){
    return {
      x: cover.dx + p.x * cover.iw * cover.scale,
      y: cover.dy + p.y * cover.ih * cover.scale
    };
  }

  function drawGlasses(lm,w,h,cover){
    var product=PRODUCTS[currentProductIndex];
    if(!product) return;

    var leftEye=toPixel(lm[33],cover);
    var rightEye=toPixel(lm[263],cover);
    var noseBridge=toPixel(lm[168],cover);
    var noseTip=toPixel(lm[1],cover);
    var leftIris=lm[468]?toPixel(lm[468],cover):null;
    var rightIris=lm[473]?toPixel(lm[473],cover):null;

    var pairs=[[127,356],[234,454],[93,323]];
    var bestLeft=null,bestRight=null,faceWidth=0;
    for(var i=0;i<pairs.length;i++){
      var l=toPixel(lm[pairs[i][0]],cover);
      var r=toPixel(lm[pairs[i][1]],cover);
      var dx=r.x-l.x,dy=r.y-l.y;
      var dist=Math.sqrt(dx*dx+dy*dy);
      if(dist>faceWidth){ faceWidth=dist; bestLeft=l; bestRight=r; }
    }
    if(!bestLeft || !bestRight || faceWidth<10) return;

    var eyeDx=rightEye.x-leftEye.x;
    var eyeDy=rightEye.y-leftEye.y;
    var rawRoll=Math.atan2(eyeDy,eyeDx);
    var eyeSpan=Math.sqrt(eyeDx*eyeDx+eyeDy*eyeDy);
    var faceMidX=(bestLeft.x+bestRight.x)/2;
    var yawRatio=(noseTip.x-faceMidX)/faceWidth;
    smoothedYaw=smoothedYaw*0.86+yawRatio*0.14;

    var visualYaw=(currentFacing==='user') ? -smoothedYaw : smoothedYaw;
    var absYaw=Math.abs(visualYaw);
    var yawN=Math.max(-1,Math.min(1,visualYaw/0.22));

    // 이 버전은 제품 실측값 대신 얼굴 폭을 기준으로 안정적으로 맞춥니다.
    // 얇은 메탈테는 얼굴 폭의 약 94%가 자연스럽습니다.
    var fitScale=(product.fitScale!=null)?product.fitScale:0.94;
    var rawWidth=faceWidth*fitScale;
    rawWidth=Math.max(faceWidth*0.84,Math.min(faceWidth*1.02,rawWidth));

    var adj=product.adjust||{};
    var rawCenterX=noseBridge.x + visualYaw*faceWidth*0.08;
    var rawCenterY=noseBridge.y + eyeSpan*(0.12+(adj.dy||0));

    if(!smoothedWidth){
      smoothedWidth=rawWidth;
      smoothedCenterX=rawCenterX;
      smoothedCenterY=rawCenterY;
      smoothedRoll=rawRoll;
    }else{
      smoothedWidth=smoothedWidth*0.76+rawWidth*0.24;
      smoothedCenterX=smoothedCenterX*0.72+rawCenterX*0.28;
      smoothedCenterY=smoothedCenterY*0.72+rawCenterY*0.28;
      smoothedRoll=smoothedRoll*0.80+rawRoll*0.20;
    }

    var frameImg=loadImage(product.assets.frame);
    var templeImg=loadImage(product.assets.temple);
    if(!frameImg.complete || !frameImg.naturalWidth ||
       !templeImg.complete || !templeImg.naturalWidth) return;

    var frameCrop=getVisibleCrop(frameImg);
    var templeCrop=getVisibleCrop(templeImg);
    var frameW=smoothedWidth;
    var frameH=frameW*(frameCrop.h/frameCrop.w)*(adj.frameScaleY||1);

    // 정면 프레임을 2.5D처럼 압축하고 고개 방향으로 조금 이동합니다.
    var perspectiveX=1-0.22*Math.abs(yawN);
    var poseShift=yawN*frameW*0.055;
    var dominantRight=yawN>=0;

    function drawTemple(isRight){
      var sideSign=isRight?1:-1;
      var dominant=(isRight===dominantRight);
      var visibility=0.10+Math.abs(yawN)*(dominant?0.90:0.48);
      if(visibility<0.03) return;

      var hingeX=sideSign*frameW*(adj.templeHingeX||0.455)*perspectiveX;
      var hingeY=frameH*(adj.templeHingeY||-0.055);
      var baseLen=frameW*(adj.templeLengthScale||0.72);
      var foreshorten=0.16+0.84*Math.abs(yawN);
      var drawW=baseLen*foreshorten*(dominant?1:0.72);
      var sourceAspect=templeCrop.h/templeCrop.w;
      var drawH=Math.max(frameH*0.055,drawW*sourceAspect*(adj.templeThicknessScale||0.72));
      var backwardsTilt=(-0.10*sideSign)+(yawN*0.055);

      ctx.save();
      ctx.translate(smoothedCenterX+poseShift,smoothedCenterY);
      ctx.rotate(smoothedRoll);
      ctx.translate(hingeX,hingeY);
      ctx.rotate(backwardsTilt);
      // 원본 다리는 왼쪽 힌지에서 오른쪽 팁 방향. 왼쪽은 좌우 반전합니다.
      if(!isRight) ctx.scale(-1,1);
      ctx.globalAlpha=Math.min(0.92,visibility);
      ctx.drawImage(templeImg,
        templeCrop.x,templeCrop.y,templeCrop.w,templeCrop.h,
        0,-drawH/2,drawW,drawH);
      ctx.restore();
    }

    function drawFrontAsset(img,crop,alpha){
      var imgH=frameW*(crop.h/crop.w)*(adj.frameScaleY||1);
      ctx.save();
      ctx.translate(smoothedCenterX+poseShift,smoothedCenterY);
      ctx.rotate(smoothedRoll);
      ctx.scale(perspectiveX,1);
      ctx.globalAlpha=alpha;
      ctx.drawImage(img,crop.x,crop.y,crop.w,crop.h,-frameW/2,-imgH/2,frameW,imgH);
      ctx.restore();
    }

    // 합성 순서: 양쪽 다리(뒤) → 정면 프레임.
    drawTemple(false);
    drawTemple(true);
    drawFrontAsset(frameImg,frameCrop,1);

    setBadge(absYaw<0.055?'정면':(absYaw<0.15?'반측면':'측면'),true);
  }

  /* -------------------- 컨트롤 -------------------- */
  flipBtn.addEventListener('click', function(){
    currentFacing = (currentFacing === 'user') ? 'environment' : 'user';
    startCamera(currentFacing);
  });

  resetBtn.addEventListener('click', function(){ startCamera(currentFacing); });

  captureBtn.addEventListener('click', function(){
    canvasEl.toBlob(function(blob){
      if (!blob) return;
      var url = URL.createObjectURL(blob);
      var isMobile = /iPhone|iPad|Android/i.test(navigator.userAgent);
      if (isMobile){
        window.open(url, '_blank');
      } else {
        var a = document.createElement('a');
        a.href = url; a.download = '으뜸50안경-가상착용.png';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
      }
    }, 'image/png', 0.95);
  });

  /* -------------------- 모달 열기 / 닫기 -------------------- */
  function openModal(){
    modalOverlay.classList.add('odm50-open');
    document.body.style.overflow = 'hidden'; // 배경 스크롤 방지

    // 모달이 화면에 그려진 다음 캔버스 크기를 다시 계산해야 정확함
    requestAnimationFrame(function(){
      resizeCanvasToVideo();
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
        setMsg('이 브라우저는 카메라 기능을 지원하지 않아요. 최신 Safari/Chrome을 이용해주세요.', false);
      } else {
        startCamera(currentFacing);
      }
    });
  }

  function closeModal(){
    modalOverlay.classList.remove('odm50-open');
    document.body.style.overflow = '';
    stopCamera(); // 모달 닫으면 카메라 자원 반드시 해제
  }

  openBtn.addEventListener('click', openModal);
  closeBtn.addEventListener('click', closeModal);
  modalOverlay.addEventListener('click', function(e){
    if (e.target === modalOverlay) closeModal(); // 바깥 여백 클릭 시 닫기
  });

  /* -------------------- 초기화 (카메라는 시작하지 않음) -------------------- */
  renderShelf();
  preloadAllImages();

})();
</script>
